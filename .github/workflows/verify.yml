name: Build and WebSocket integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          check-latest: true
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build WAR and run Java tests
        run: ./mvnw -B -ntp verify
      - name: Run client tests
        run: node --test tests/*.test.cjs
      - name: Verify live HTTP and WebSocket behavior
        run: java tests/SmokeCheck.java
      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Test the running application
        working-directory: e2e
        run: npm test
      - name: Upload WAR
        uses: actions/upload-artifact@v7.0.2
        with:
          name: websocket-lab-war
          path: target/websocket-lab.war
      - name: Upload browser report and server diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
